name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile third_party/akacross/bin/write-config.py
          python -m py_compile third_party/akacross/bin/cdp.py
          python -m py_compile third_party/akacross/bin/kick-updater.py
          python -m py_compile tests/test-runner-policy.py
          python -m py_compile tests/test-install-state.py
      - name: Test runner selection policy
        run: python tests/test-runner-policy.py
      - name: Test FiveM staged-install detection
        run: python tests/test-install-state.py
      - name: Validate all shell scripts
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n tests/test-uninstall.sh
          bash -n tests/test-env.sh
          bash -n tests/test-config.sh
          bash -n tests/test-cfx-handler.sh
          bash -n tests/test-devtools-opt-in.sh
          find third_party/akacross -type f -name '*.sh' -print0 | while IFS= read -r -d '' script; do
            bash -n "$script"
          done
      - name: Compile embedded Python heredocs
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path("install.sh"), Path("uninstall.sh"), *Path("tests").rglob("*.sh"), *Path("third_party/akacross").rglob("*.sh")]
          for path in files:
              lines = path.read_text(encoding="utf-8").splitlines()
              i = 0
              while i < len(lines):
                  if "<<'PY'" not in lines[i]:
                      i += 1
                      continue
                  i += 1
                  block = []
                  while i < len(lines) and lines[i] != "PY":
                      block.append(lines[i])
                      i += 1
                  if i == len(lines):
                      raise SystemExit(f"{path}: unterminated Python heredoc")
                  compile("\n".join(block), f"{path}:embedded-python", "exec")
                  i += 1
              print(f"validated embedded Python: {path}")
          PY
      - name: "Smoke test: show uninstaller usage"
        run: |
          bash uninstall.sh --help
      - name: Test prefix rollback in an isolated fixture
        run: bash tests/test-uninstall.sh
      - name: Test environment setup without WebView2
        run: bash tests/test-env.sh
      - name: Test FiveM Enhanced TOML configuration
        run: bash tests/test-config.sh
      - name: Test cfx URL handler safely rejects unsupported forwarding
        run: bash tests/test-cfx-handler.sh
      - name: Ensure WebView2 DevTools stay opt-in
        run: bash tests/test-devtools-opt-in.sh
      - name: Validate required Lutris integration files
        run: |
          test -x /usr/bin/bash
          test -f app.py
          test -f uninstall.sh
          test -f third_party/akacross/install-lutris.sh
          test -f third_party/akacross/bin/fetch-launcher.sh
          test -f third_party/akacross/bin/fetch-product.sh
          test -f third_party/akacross/bin/register.sh
